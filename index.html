<!-- ======================================================
     HEAD

====================================================== -->
<head>

    <!-- Permite utilizar acentos e caracteres especiais -->

    <!-- Nome que aparece na aba do navegador -->

          type="image/svg+xml"

    <!-- Marca o <html> assim que o JS estiver disponível, para as animações de rolagem -->
    <script>document.documentElement.classList.add('js');</script>

    ====================================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap"
